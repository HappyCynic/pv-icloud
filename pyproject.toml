[project]
name = "pv-icloud"
version = "0.2.0"
description = "Private iCloud MCP: a read-only MCP server for iCloud Mail, Calendar and Contacts (multi-account)"
requires-python = ">=3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Happy Cynic Software LLC", email = "pv-icloud@happycynic.com" }]
dependencies = [
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "mcp>=2.3.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "starlette>=1.7.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/HappyCynic/pv-icloud"

[project.scripts]
pv-icloud = "pv_icloud.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_icloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-python-dateutil>=2.9.0.20260807",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.mypy]
python_version = "3.14"
files = ["src"]
warn_unused_ignores = true
