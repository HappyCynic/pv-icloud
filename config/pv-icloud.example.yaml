# pv-icloud configuration TEMPLATE. Copy to pv-icloud.yaml (gitignored) and fill in.
# The real file is per deployment (the dev container copies this on first start; a server
# gets its own copy, e.g. from configuration management). Not secret: tokens are SHA-256
# hashes and iCloud credentials come from env (PV_ICLOUD_<ID>_ICLOUD_USER / _APP_PASSWORD).
# See docs/adr/0003-multi-account.md.
#
# Generate a token and its hash:
#   uv run pv-icloud hash-token

defaults:
  mail:
    # Folder names are display names; the server decodes IMAP modified UTF-7.
    folders: { include: "*", exclude: [] }
    # iCloud system folders. false (the default) hides the folder whatever `include` says;
    # true treats it like any other folder (include/exclude still apply). Set per account
    # under accounts[].mail.special_folders to override these defaults.
    special_folders:
      junk: false              # Junk
      deleted_messages: false  # Deleted Messages
      drafts: false            # Drafts
    max_age_days: 730          # index backfill window; searches clamp to it
    max_connections: 2         # per account (iCloud limit is per Apple ID)
    # Mail writes are OFF. They need PV_ICLOUD_MAIL_WRITE=enabled in the environment and a
    # per-token grant (accounts[].tokens[].mail_write, below); see
    # docs/adr/0004-opt-in-mail-write.md. These settings have no effect until then.
    write:
      # Nothing can be moved, archived or deleted into or out of these folders. An account's
      # own list adds to this one; a token's `protected_folders` adds to both. Drafting is
      # governed by the `draft` grant, not by this list.
      protected_folders: []
      archive_folder: Archive  # where mail_archive moves messages (found by name)
      # From of drafts and sent mail: the account's iCloud address or one of its aliases.
      # Unset: drafts have no From (Mail fills it in). Required if a token has `send`.
      # send_from: someone@example.com
  calendar:
    # Calendar display names, globs allowed; applies to subscribed calendars too.
    calendars: { include: "*", exclude: [] }
    max_range_days: 90         # longest calendar_events range
    max_search_days: 730       # longest calendar_search range
    # Subscribed (webcal) calendars: iCloud does not serve their events, so the server can
    # fetch each feed from its publisher. Off here: true makes outbound HTTPS requests to
    # those publishers (any public host; see docs/egress.md). false = listed, no events.
    subscriptions: false
    # timezone: America/Chicago  # for date-only ranges and new events; default: iCloud's
    # Calendar writes are OFF. They need PV_ICLOUD_CALENDAR_WRITE=enabled in the environment
    # and `calendar_write: true` on a token (below); see docs/adr/0005-opt-in-calendar-write.md.
    # This setting has no effect until then.
    write:
      # Calendar display names, exact (case-sensitive, no globs): readable, never written.
      # An account's own list adds to this one; a token's `protected_calendars` adds to both.
      protected_calendars: []
  contacts:
    enabled: true              # false: no contacts tools; find_person uses mail only
    # Contacts in these groups are hidden from every tool (group names, globs allowed).
    exclude_groups: []

accounts:
  - id: me
    tokens:
      # Read-only, as every token is unless it lists `mail_write`. With
      # PV_ICLOUD_MAIL_WRITE=enabled a token may be granted, each on its own:
      #   mail_write: [move, archive, delete, draft]
      #                       # delete only moves to Deleted Messages; draft saves to Drafts
      #                       # for a person to review and send (never sent by pv-icloud)
      #   protected_folders: [Work]             # added to the account's protected folders
      #   max_writes_per_hour: 30               # default 30; held in memory
      # `send` (mail_send) sends mail as this account and CANNOT be undone. Prefer `draft`.
      # If a client must send, grant it on its own, limit the recipients with `send_to`
      # (exact addresses or @domain entries), and set mail.write.send_from above. Without
      # send_to the token may send to anyone and the server warns at startup.
      #   mail_write: [send]
      #   send_to: [someone@example.com, "@example.org"]
      # With PV_ICLOUD_CALENDAR_WRITE=enabled a token may create, change and delete events,
      # one event or occurrence per call, in the account's own writable calendars (and
      # calendars shared with it read-write; a change there is seen by everyone sharing it).
      # Subscribed and protected calendars stay read-only; events with attendees or organised
      # by someone else are refused. Writes share the token's max_writes_per_hour with mail.
      #   calendar_write: true                  # default false
      #   protected_calendars: [Family]         # added to the account's protected calendars
      # Contact writes are OFF. With PV_ICLOUD_CONTACTS_WRITE=enabled a token may be granted
      # each action on its own (see docs/adr/0006-opt-in-contact-write.md), one contact per
      # call, never in an excluded group. Updates keep every field they do not name. A delete
      # is permanent and syncs to every device; the owner's own card is never deleted.
      # Writes share the token's max_writes_per_hour with mail and calendar writes.
      #   contacts_write: [create, update, delete]   # default: none
      - { label: laptop, sha256: "REPLACE_ME" }
    mail:
      folders: { exclude: [] }
