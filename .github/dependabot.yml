# Weekly update pull requests. CI must pass before anything is merged; check release notes
# for runtime dependencies, which ship in the image. Only releases out for two weeks are
# proposed (cooldown).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      dev-dependencies: { dependency-type: development }
  # Base images, pinned by digest in both Dockerfiles.
  - package-ecosystem: docker
    directories: [/, /.devcontainer]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: devcontainers
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
