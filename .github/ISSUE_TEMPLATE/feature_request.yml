name: Feature request
description: Suggest a change or a new tool.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or question you want an MCP client to handle, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested change
      description: |
        Optional. Note that the server is read-only by default: mail, calendar and contact
        writes are each opt-in (docs/adr/0004, 0005 and 0006), and any new kind of change to
        iCloud data needs a design discussion first.
